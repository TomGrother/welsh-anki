<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2029"/>
      <stop offset="100%" stop-color="#0f1319"/>
    </linearGradient>
    <linearGradient id="scale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="55%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#a82424"/>
    </linearGradient>
    <linearGradient id="jaw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e08a"/>
      <stop offset="100%" stop-color="#00824a"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- back horn -->
  <path d="M122 46 C140 26 168 22 182 30 C166 36 152 50 144 70 Z" fill="url(#horn)"/>
  <!-- front horn -->
  <path d="M96 36 C104 16 128 8 146 14 C134 24 124 40 120 58 Z" fill="url(#horn)"/>

  <!-- neck / head shape -->
  <path d="M40 168
           C28 140 32 104 60 80
           C84 60 122 56 150 70
           C172 81 182 104 176 124
           C172 138 158 146 144 144
           L150 160
           L132 152
           C120 162 100 166 84 162
           C66 158 50 150 40 168 Z"
        fill="url(#scale)"/>

  <!-- jaw / snout -->
  <path d="M150 70 C172 81 182 104 176 124 C172 138 158 146 144 144 L150 122 C156 106 152 86 134 76 Z" fill="#c53030"/>

  <!-- lower jaw -->
  <path d="M118 130 C134 124 150 130 156 144 C146 156 128 160 114 152 Z" fill="url(#jaw)"/>

  <!-- teeth -->
  <path d="M124 136 L128 146 L132 136 Z" fill="#fff"/>
  <path d="M138 134 L142 145 L146 134 Z" fill="#fff"/>

  <!-- spikes along back -->
  <path d="M58 84 L48 68 L70 78 Z" fill="url(#horn)"/>
  <path d="M78 70 L70 52 L92 64 Z" fill="url(#horn)"/>

  <!-- eye -->
  <circle cx="138" cy="92" r="9" fill="#fff7e8"/>
  <circle cx="141" cy="92" r="4.5" fill="#1a2029"/>
  <circle cx="139.5" cy="90" r="1.6" fill="#fff"/>

  <!-- nostril -->
  <circle cx="172" cy="112" r="3" fill="#7a1f1f"/>

  <!-- flame breath -->
  <path d="M16 174 C32 164 50 162 66 170 C52 180 32 184 14 180 C10 178 10 176 16 174 Z" fill="#ffb347"/>
  <path d="M10 168 C24 160 38 160 50 166 C38 174 22 176 8 172 C5 170 5 169 10 168 Z" fill="#ffd95e"/>
</svg>
