<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2029"/>
      <stop offset="100%" stop-color="#0f1319"/>
    </linearGradient>
    <linearGradient id="scale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="55%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#a82424"/>
    </linearGradient>
    <linearGradient id="horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e08a"/>
      <stop offset="100%" stop-color="#00824a"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- neck -->
  <path d="M30 178 C26 150 36 122 58 110 L88 96 L96 116 L68 134 C54 144 48 162 52 178 Z" fill="url(#scale)"/>

  <!-- frill spikes along neck -->
  <path d="M58 110 L46 92 L70 100 Z" fill="url(#horn)"/>
  <path d="M72 102 L62 84 L86 92 Z" fill="url(#horn)"/>
  <path d="M88 96 L80 78 L102 86 Z" fill="url(#horn)"/>

  <!-- head / snout, facing right -->
  <path d="M86 92
           C84 70 100 52 126 50
           C150 48 172 60 182 80
           C188 92 186 104 176 110
           L186 118 L170 122
           L172 134 L156 128
           C146 138 128 142 112 136
           C96 130 86 114 86 92 Z"
        fill="url(#scale)"/>

  <!-- upper horn -->
  <path d="M126 50 C132 30 154 18 174 22 C162 32 150 46 144 64 Z" fill="url(#horn)"/>

  <!-- jaw line -->
  <path d="M112 136 C124 132 140 128 156 128 L154 116 C140 118 122 120 110 124 Z" fill="#a82424"/>

  <!-- teeth -->
  <path d="M150 126 L154 138 L158 126 Z" fill="#fff"/>
  <path d="M164 122 L168 134 L172 122 Z" fill="#fff"/>

  <!-- eye -->
  <circle cx="148" cy="78" r="9" fill="#fff7e8"/>
  <circle cx="151" cy="78" r="4.5" fill="#1a2029"/>
  <circle cx="149.5" cy="76" r="1.6" fill="#fff"/>

  <!-- nostril -->
  <circle cx="180" cy="86" r="3" fill="#7a1f1f"/>

  <!-- flame breath -->
  <path d="M170 134 C182 142 188 156 184 172 C172 164 162 152 160 138 Z" fill="#ffb347"/>
  <path d="M174 138 C182 146 186 156 184 168 C176 162 168 152 166 142 Z" fill="#ffd95e"/>
</svg>
